name: PracticeArenas
version: 1.0.0
main: com.practiceserver.arenas.ArenasPlugin
api-version: '1.21'
description: Mode menu, arena slots, player kits and PracticeBot spawning.
softdepend: [PracticeBot]
commands:
  practice:
    description: Open the practice menu
    permission: practicearenas.use
  leave:
    description: Leave the arena and go back to the lobby
    permission: practicearenas.use
  parena:
    description: Arena admin commands
    permission: practicearenas.admin
permissions:
  practicearenas.use:
    default: true
  practicearenas.admin:
    default: op
