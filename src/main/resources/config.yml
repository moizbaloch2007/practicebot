# ==========================================================
#  PracticeCore config      (reload with /parena reload)
#  Colors use & codes. Everything here can be changed.
# ==========================================================

# Print the commands the plugin runs to the console (helps when testing).
debug: false

# Used only if the lobby spawn is not set. Normally leave this empty and run
# /parena setlobby where players should appear.
lobby-command: ""

# Command that spawns the PracticeBot bot. Runs as console.
bot-spawn-command: "pbadmin template spawn {template} {player} {world} {x} {y} {z} {yaw} {pitch}"

# How far in front of the player's spawn the bot appears (blocks).
bot-distance: 8.0

# After picking an arena the player gets this many seconds to set up their
# kit. The fight also starts when they type /fight or click the START button.
# Set 0 to wait forever for /fight.
prep-seconds: 10

# Countdown (3, 2, 1) before the bot spawns.
countdown-seconds: 3

# Players who die lose their kit instead of dropping it in the arena.
clear-drops-on-death: true

# When a fight ends (death, /leave, lobby, quit) the player's bots are removed at once through
# PracticeBot's API, so an old bot can never attack the same player again. The commands below
# are only a fallback if the API is not available.
bot-cleanup:
  enabled: true
  sweep: true             # every 2 seconds, remove bots of players who are not in a practice session
                          # (admins with practicecore.bypass are ignored, so you can still test bots)
  list-command: "pbadmin bot list --target {player}"
  despawn-command: "pbadmin bot despawn {id}"

# ---------------------------------------------------------- custom mode
# Custom mode: the player picks an arena, gets NO kit and NO automatic bot. They choose a kit with
# /kits and control their bot with PracticeBot's own /spawnbot menu (settings, type, start).
custom-mode:
  auto-spawnbot: true     # open the /spawnbot menu automatically one second after arriving

# ---------------------------------------------------------- items inside an arena
# slot = position in a normal session. custom-slot = position in custom mode (empty inventory).
# action = a command the player runs when they click the item.
arena-items:
  enabled: true
  items:
    kits:
      slot: 34
      custom-slot: 7
      material: BOOK
      name: "&b&lKits &7(Right Click)"
      lore: ["&7Choose your default or custom kit"]
      action: "kits"
    effects:
      slot: 35
      custom-slot: 8
      material: BREWING_STAND
      name: "&d&lEffects &7(Right Click)"
      lore: ["&7Give yourself regeneration, health boost..."]
      action: "effects"

# Effects players can give themselves (no permission needed). Keep them weak so nobody is unbeatable.
effects:
  enabled: true
  allow-in-fight: true
  list:
    regeneration:
      name: "&c&lRegeneration I"
      icon: GHAST_TEAR
      effect: regeneration
      level: 1
      seconds: 120
      lore: ["&7Slowly heals you"]
    health_boost:
      name: "&6&lHealth Boost II"
      icon: GOLDEN_APPLE
      effect: health_boost
      level: 2
      seconds: 300
      lore: ["&7+4 extra hearts"]
    absorption:
      name: "&e&lAbsorption I"
      icon: GOLDEN_CARROT
      effect: absorption
      level: 1
      seconds: 120
      lore: ["&7+2 yellow hearts"]
    fire_resistance:
      name: "&6&lFire Resistance"
      icon: MAGMA_CREAM
      effect: fire_resistance
      level: 1
      seconds: 180
      lore: ["&7Useful for UHC and cart"]
  clear:
    name: "&7&lRemove all effects"
    icon: MILK_BUCKET
    lore: ["&7Clears every effect you have"]

# ---------------------------------------------------------- lobby
# Spawn point: /parena setlobby. Players land there on join, respawn, /spawn and /leave.
lobby:
  worlds: []             # lobby worlds. Empty = the world of the lobby spawn
  spawn-on-join: true
  respawn-at-lobby: true
  protect:               # simple protection inside the lobby world
    enabled: true
    build: true          # no placing or breaking blocks
    damage: true         # no damage (the void sends you back to the spawn)
    hunger: true
    drop-items: true

# Items players get in the lobby (replaces ItemJoin).
# action: a command run by the player. Use "console: say hi {player}" to run it as console.
lobby-items:
  enabled: true
  items:
    menu:
      slot: 4
      material: NETHER_STAR
      name: "&a&lPractice Menu &7(Right Click)"
      lore: ["&7Choose a mode and fight bots"]
      action: "pc"
    kits:
      slot: 2
      material: ANVIL
      name: "&e&lKit Editor &7(Right Click)"
      lore: ["&7Arrange your kit for each mode"]
      action: "pc kit"

# ---------------------------------------------------------- arena regeneration (needs FastAsyncWorldEdit)
# Workflow: build an arena, add spawns, select it with //wand, then /parena save <id>.
# /parena clone <id> <count> makes copies with the same spawn points.
# After a fight the area around that player's slot is restored from the snapshot, and
# leftover crystals, minecarts, TNT, items and arrows are removed.
# Keep slots at least radius x 2 blocks apart.
regen:
  enabled: true
  radius: 60        # blocks around the slot, in every horizontal direction
  below: 15         # blocks restored below the slot
  above: 60         # blocks restored above the slot
  delay-ticks: 20   # wait after the fight ends before restoring
  schematic-folders:
    - plugins/FastAsyncWorldEdit/schematics
    - plugins/WorldEdit/schematics

# /parena clone puts new copies in the same world, this many blocks apart.
clone:
  gap: 100

# Timed reset of the whole arena (like ArenaRegen). Only arenas that were used get reset.
auto-regen:
  enabled: true
  interval-minutes: 5
  players: kick           # kick = players are sent to the lobby when the time is up
                          # wait = the arena is only reset when it is empty
  no-join-seconds: 10     # nobody can join an arena in the last seconds before its reset
  warn-seconds: [60, 30, 10, 5, 4, 3, 2, 1]

menus:
  show-arena-list: false    # true = also list every arena (id and players) in the arena tooltip
  style: dialog           # dialog = Minecraft dialog windows (Paper 1.21.7+), chest = inventory menus
  hub-title: "&8&lPracticeCore"
  hub-size: 27
  mode-title: "&8&lChoose Mode"
  editor-mode-title: "&8&lKit Editor - Choose Mode"
  mode-size: 27
  diff-title: "&8&lChoose Difficulty"
  diff-size: 27
  type-title: "&8&lChoose Arena"
  type-size: 27
  kit-slot-title: "&8&lEdit a Kit"
  kit-mode-title: "&8&lKits - Choose Mode"
  kit-select-title: "&8&lChoose Your Kit"
  effects-title: "&8&lEffects"
  filler: true

