  uhc:
    slot: 16
    icon: LAVA_BUCKET
    name: "&6&lUHC"
    lore: ["&7Bow, lava and webs"]
    templates: {easy: pa_uhc_easy, medium: pa_uhc_medium, hard: pa_uhc_hard}
