# ==========================================================
#  PracticeCore config      (reload with /pc admin reload)
#  Colors use & codes.
# ==========================================================

# Print the commands the plugin runs to the console (helps when testing).
debug: false

# Command used to send a player back to the lobby. Runs as console.
lobby-command: "warp lobby {player}"

# Command that spawns the PracticeBot bot. Runs as console.
bot-spawn-command: "pbadmin template spawn {template} {player} {world} {x} {y} {z} {yaw} {pitch}"

# How far in front of the player's spawn the bot appears (blocks).
bot-distance: 8.0

# After picking an arena the player gets this many seconds to set up their
# kit. The fight also starts when they type /fight or click the START button.
# Set 0 to wait forever for /fight.
prep-seconds: 30

# Countdown (3, 2, 1) before the bot spawns.
countdown-seconds: 3

# Players who die lose their kit instead of dropping it in the arena.
clear-drops-on-death: true

# When a fight ends the player's bots are removed (so an old bot never attacks
# the same player later). The plugin lists the player's bots with PracticeBot's
# command and runs the despawn command for every id it finds.
bot-cleanup:
  enabled: true
  list-command: "pbadmin bot list --target {player}"
  despawn-command: "pbadmin bot despawn {id}"

menus:
  hub-title: "&8&lPracticeCore"
  hub-size: 27
  mode-title: "&8&lChoose Mode"
  editor-mode-title: "&8&lKit Editor - Choose Mode"
  mode-size: 27
  diff-title: "&8&lChoose Difficulty"
  diff-size: 27
  type-title: "&8&lChoose Arena"
  type-size: 27
  filler: true

messages:
  prefix: "&8[&bPractice&8] "
  no-permission: "&cYou do not have permission for this mode."
  arena-full: "&cAll arenas of that type are full or not built yet. Try another one."
  world-missing: "&cThat arena's world is not loaded. Tell an admin."
  prep: "&aSet up your hotbar. Nothing attacks you until you start."
  prep-help: "&7Or type &e/fight&7. Use &e/leave &7to go back to the lobby."
  no-session: "&cYou are not in a practice session. Use &e/pc&c."
  kit-saved: "&aKit layout saved."
  kit-reset: "&eKit reset to the default layout."
  kit-deleted: "&cItem deleted from the kit."
  kit-added: "&aAdded to your kit."
  kit-full: "&cYour kit is full. Delete an item first."
  kit-cursor: "&cPut the item you are holding on a slot first."

# ---------------------------------------------------------- main menu
hub:
  play:
    slot: 11
    icon: DIAMOND_SWORD
    name: "&a&lPlay"
    lore: ["&7Pick a mode, difficulty and arena"]
  editor:
    slot: 13
    icon: ANVIL
    name: "&e&lKit Editor"
    lore: ["&7Arrange your hotbar for each mode"]
  leave:
    slot: 15
    icon: RED_BED
    name: "&c&lBack to Lobby"
    lore: ["&7Leave your practice session"]

# ---------------------------------------------------------- difficulties
difficulties:
  easy:
    slot: 11
    icon: LIME_CONCRETE
    name: "&a&lEasy"
    lore: ["&7Slow bot, makes mistakes"]
  medium:
    slot: 13
    icon: YELLOW_CONCRETE
    name: "&e&lMedium"
    lore: ["&7Balanced bot"]
  hard:
    slot: 15
    icon: RED_CONCRETE
    name: "&c&lHard"
    lore: ["&7Fast, accurate and aggressive"]

# ---------------------------------------------------------- modes
# templates = PracticeBot template per difficulty (from pa_templates.yml)
# permission = permission needed to pick the mode (leave empty for everyone)
modes:
  normal:
    slot: 10
    icon: DIAMOND_SWORD
    name: "&e&lNormal"
    lore: ["&7Sword PvP"]
    templates: {easy: pa_normal_easy, medium: pa_normal_medium, hard: pa_normal_hard}
    permission: practicebot.spawn.normal
  cpvp:
    slot: 11
    icon: END_CRYSTAL
    name: "&d&lCPVP"
    lore: ["&7Crystal PvP"]
    templates: {easy: pa_cpvp_easy, medium: pa_cpvp_medium, hard: pa_cpvp_hard}
    permission: practicebot.spawn.cpvp
  mace:
    slot: 12
    icon: MACE
    name: "&b&lMace"
    lore: ["&7Mace PvP"]
    templates: {easy: pa_mace_easy, medium: pa_mace_medium, hard: pa_mace_hard}
    permission: practicebot.spawn.mace
  spearmace:
    slot: 14
    icon: TRIDENT
    name: "&3&lSpear-Mace"
    lore: ["&7Spear and mace PvP"]
    templates: {easy: pa_spearmace_easy, medium: pa_spearmace_medium, hard: pa_spearmace_hard}
    permission: practicebot.spawn.spear-mace
  cart:
    slot: 15
    icon: TNT_MINECART
    name: "&c&lCart"
    lore: ["&7TNT minecart PvP"]
    templates: {easy: pa_cart_easy, medium: pa_cart_medium, hard: pa_cart_hard}
