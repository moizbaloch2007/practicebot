# ---------------------------------------------------------- arena types
# Build arenas of a type with:  /parena create <type> <id>
# then stand on each player spawn and run:  /parena addspawn <id>
# Every spawn is one player slot (6 spawns = 6 players in that arena).
arena-types:
  plains:
    slot: 11
    icon: GRASS_BLOCK
    name: "&a&lPlains"
    lore: ["&7Open grass arena"]
  nether:
    slot: 13
    icon: NETHERRACK
    name: "&c&lNether"
    lore: ["&7Nether arena"]
  desert:
    slot: 15
    icon: SAND
    name: "&e&lDesert"
    lore: ["&7Sand arena"]

