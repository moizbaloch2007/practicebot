# ==========================================================
#  PracticeBot - Bot Template Configuration
#
#  Template command namespace:
#    /pbadmin template create <template>
#    /pbadmin template edit <template>
#    /pbadmin template cancel
#    /pbadmin template delete <template>
#    /pbadmin template spawn <template> [target]
#    /pbadmin template spawn <template> [target] <world> <x> <y> <z> <yaw> <pitch>
#
#  Section rules:
#    NORMAL templates use: general + settings + combat + inventory
#    CPVP templates use:   general + inventory + cpvp
#    MACE templates use:   general + inventory + mace
#    SPEAR_MACE templates use: general + inventory + spear-mace
#    CART templates use:   general + inventory + cart
#    UHC templates use:    general + inventory + uhc
#    DUMMY templates use:  general + settings + inventory
#
#  General fields:
#    name                    Internal readable name.
#    display-name            NPC name shown above the bot.
#    skin-name               Minecraft account skin name. Empty/AUTO = SHELDERA skin.
#    bot-type                NORMAL, CPVP, MACE, SPEAR_MACE, CART, UHC, or DUMMY.
#    allow-gui               Compatibility flag. Runtime template bots keep normal GUI closed.
#    despawn-on-owner-world-change  Despawn on owner world change when this bot has an owner.
#    target-binding          REQUIRED = target player needed, NONE = nearest player, BOT = nearest bot.
#    death-mode              REMOVE = despawn after death, RESPAWN = respawn from this template.
#    kill-mode               DESPAWN = despawn after killing target, RESPAWN = respawn, NONE = stay alive.
#    respawn-delay-seconds   Delay before respawn when death-mode/kill-mode uses RESPAWN.
#    warm-up-seconds         Delay before the bot starts fighting after spawn.
#
#  Settings fields for NORMAL/DUMMY:
#    look-at-target          Turn head/body toward target.
#    follow-target           Follow the selected target.
#    random-walk             Wander naturally when idle.
#    hold-shield             Visually hold shield when available.
#    use-shield              Use shield defensively.
#    resistance              Apply resistance behavior/effect where supported.
#    frozen                  DUMMY only. Locks movement when true.
#    shield-in-main-hand     Put shield in main hand instead of offhand.
#    shield-reset.enabled                    Restore shield after durability break.
#    shield-reset.delay-seconds              Delay before durability-broken shield returns.
#    shield-reset.axe-stun-seconds           Time shield stays disabled after axe hit.
#    shield-durability.unbreaking-3          Give shield Unbreaking III.
#    shield-durability.unbreakable           Prevent durability break. Axe stun still works.
#    pvp-enabled             NORMAL only. Enables melee PvP logic.
#
#  Combat fields for NORMAL:
#    strafe                  Strafe while fighting.
#    wtap                    Use W-tap knockback timing.
#    stap                    Use S-tap spacing.
#    crits                   Try critical hits.
#    shield-breaker          Use axe/shield-break behavior when applicable.
#    retreat                 Back off when low/unsafe.
#    reach-mode              SHORT, NORMAL, EXTENDED, or ADVANCED.
#    aggression              LOW, MEDIUM, or HIGH.
#    crit-chance             25, 50, 75, or 100.
#    crit-speed              SLOW, NORMAL, or FAST.
#    gapple-enabled          Allow golden apple healing.
#    gapple-health-hearts    Eat at or below this health, from 1.0 to 10.0 hearts.
#    potion-mode             0 = off, 1 = Strength II, 2 = Strength II + Speed II, 3 = all + Fire Resistance.
#
#  Inventory fields for all template types:
#    helmet/chestplate/leggings/boots-material  leather, copper, gold, chain, iron, diamond, netherite.
#    helmet/chestplate/leggings/boots-enchant   protection, blast_protection, or none.
#    offhand-type                               totem, shield, or none.
#    totem-count                                Amount of totems to give when offhand uses totems.
#    armor-durability.breakable                 Use normal Minecraft armor durability.
#    armor-durability.unbreaking-3              Give armor Unbreaking III while still allowing it to break.
#    main-hand.material                         Bukkit material name for custom weapon/item.
#    main-hand.amount                           Stack amount.
#    main-hand.unbreakable                      Makes the item unbreakable.
#    main-hand.enchantments                     Enchantment keys and levels.
#    trims.<piece>.pattern/material             Armor trim pattern/material. Empty = no trim.
#
#  CPVP fields for CPVP:
#    enabled                                   Must be true for CPVP templates.
#    skill-level                               EASY, MEDIUM, HARD, or PRO preset name.
#    aggression-weight                         Higher = more aggressive crystal pressure.
#    use-pearls                                Allow ender pearl movement/tactics.
#    use-mace                                  Allow mace logic when available.
#    use-golden-apples                         Allow golden apple healing.
#    place-obsidian                            Allow obsidian base placement.
#    break-blocks                              Allow block mining/breaching.
#    strafing-enabled                          Allow CPvP strafe movement.
#    anchoring-mode                            Allow respawn anchor combat.
#    heal-threshold                            HP ratio where healing starts, 0.4 = 40%.
#    low-hp-crystal-lethal-reserve             Extra low-health safety reserve against self-damage.
#    pearl-cooldown-ms                         Minimum milliseconds between pearls.
#    fov-degrees                               CPvP action FOV. Lower = more human, higher = more permissive.
#    place-delay-min/max-ms                    Random crystal place delay range.
#    break-delay-min/max-ms                    Random crystal break delay range.
#    sword-delay-ms                            Delay between sword/mace hits when CPvP allows melee.
#    reaction-hesitation-*                     Humanized hesitation chance and duration.
#    crystal-miss-*                            Humanized crystal miss/pause chance and duration.
#    non-urgent-pearl-restraint-chance-percent Chance to avoid non-urgent pearls.
#
#  MACE fields for MACE:
#    enabled                          Must be true for Mace templates.
#    skill-level                      0-3. Higher presets improve aim and confirmations.
#    aggression                       0-3. Higher = more frequent attack commits.
#    aim-success-chance-percent       Chance for clean mace aim confirmation.
#    stun-slam-success-chance-percent Chance for axe disable into mace punish.
#    breach-swap-success-chance-percent Chance for correct sword-to-Breach swap.
#    pearl-wind-success-chance-percent Chance for successful Pearl + Wind air reset.
#    use-ground-pop                   Allow Wind Charge takeoff from ground.
#    use-pearls                       Allow Ender Pearl + Wind Charge air reset.
#    use-elytra                       Allow temporary Elytra aerial mode.
#    use-shield-defense               Allow main-hand shield timing.
#    use-counter-slam                 Allow shield disable into stun slam.
#    use-gapples                      Allow golden apple recovery.
#    use-potions                      Allow Strength II and Speed II splash potions.
#    use-axe-disable                  Allow axe shield disable.
#    use-breach-swap                  Allow sword-to-Breach mace ground swap.
#    use-wind-burst-chain             Allow Density/Wind Burst chain attempts.
#    aerial-landing-chance-percent    Chance to naturally land instead of air reset.
#    elytra-unbreaking-3              Give Elytra Unbreaking III.
#
#  SPEAR_MACE fields under spear-mace (Minecraft Java 1.21.11+):
#    enabled                          Enable combat; defaults to true for this template type.
#    skill-level                      0 = Easy, 1 = Medium, 2 = Hard, 3 = Expert.
#    aggression                       0 = Defensive, 1 = Balanced, 2 = Aggressive, 3 = Relentless.
#    humanization-percent             0-100 natural timing/movement variation.
#    infinite-inventory               Replenish the managed kit; never overwrites API-owned inventory.
#    techniques.<key>                 0 disables; 1-100 chance in an eligible situation.
#      Keys: jab, charge, lunge, backstab, pearl-catch, diagonal-catch,
#            stun-slam, d-tap, density-smash, breach, attribute-hop,
#            wind-charge-jump, axe-disable, shield, defense, gapples,
#            strength-potion, speed-potion.
#    attribute-hop is config/API-only and experimental; keep 0 unless explicitly needed.
#    shield uses the main hand for aerial defense; totems remain in the offhand.
#    Omitted Spear-Mace fields inherit config.yml -> spear-mace.defaults.
#    Native range, hunger, item availability and cooldowns still apply at 100%.
#
#  CART fields for CART:
#    enabled                          Compatibility field; Cart templates always enable combat.
#    skill-level, aggression          0-3 professional execution/pressure profiles.
#    place/ignite-*-percent           Legacy motor quality controls.
#    use-pre-cart/pre-rail/insta-cart Enable the main legal bow sequences.
#    use-crossbow/pearl/block/ledge/chain-cart Enable advanced techniques.
#    *-frequency-percent              0-100 chance per eligible technique window.
#    defensive-awareness[-percent]    Detect and react to hostile setup sequences.
#    infinite-inventory               Replenish legal kit resources when enabled.
#    adaptive-mind-games              Adapt mix selection to observed target habits.
#    humanization-percent             Natural correlated timing/movement variation.
#
#  UHC fields for UHC:
#    enabled                          Compatibility field; UHC templates always normalize to true.
#    skill-level                      0-3. Controls perception, reactions and aim motor quality.
#    aggression                       0-3. Controls entry pressure and reset frequency.
#    bow-accuracy-percent             0-100. Chance of a clean correlated ranged release.
#    use-bow                          Allow limited bow shots after disengaging.
#    use-crossbow                     Allow preloading and crossbow reset/utility setups.
#    use-lava                         Allow cue-based S-hold, web-lava and re-lava plays.
#    use-water                        Allow recovery, water dunk and fall clutch plays.
#    use-webs                         Allow predicted landing, head-web and web-drain plays.
#    use-gapples                      Allow pre-gap and safe disengage healing.
#    use-axe-disable                  Allow axe entries and shield momentum breaks.
#    use-shield-stun                  Double-click after a crouch axe disable.
#    web-trap-frequency-percent       0-100. Frequency of eligible cobweb captures.
#    web-lava-combo-frequency-percent 0-100. Frequency of Web + Lava trap conversions.
#    full-box-frequency-percent       Compatibility field; forced to 0 (FullBox disabled).
#    melee-accuracy-percent           0-100. Humanized chance to commit an eligible melee hit.
#    ranged-frequency-percent         0-100. Frequency of valid Bow/Crossbow windows.
#    adaptive-mind-games              Adapt tactics to observed target habits.
#    use-shield-defense               Allow timed defensive shield use.
#    infinite-inventory               Replenish consumed UHC kit resources when enabled.
#    rage-enabled                     Allow rare ten-second all-in pressure windows.
# ==========================================================

