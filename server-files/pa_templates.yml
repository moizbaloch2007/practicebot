# ==========================================================
#  PracticeArenas difficulty templates (generated from your
#  PracticeBot default templates, only skill/aggression and a few
#  accuracy settings are changed).
#
#  Paste everything below UNDER the existing "templates:" line in
#  plugins/PracticeBot/bot_templates.yml (keep the 2-space indent),
#  then run: /pbadmin reload
#  18 templates: pa_<mode>_<easy|medium|hard>
# ==========================================================

  pa_normal_easy:
    name: Normal Easy
    display-name: '&aEasy Normal Bot'
    bot-type: NORMAL
    allow-gui: false
    despawn-on-owner-world-change: true
    target-binding: REQUIRED
    death-mode: RESPAWN
    kill-mode: DESPAWN
    respawn-delay-seconds: 3
    warm-up-seconds: 0
    skin-name: ''
    settings:
      look-at-target: true
      follow-target: false
      random-walk: false
      hold-shield: false
      use-shield: true
      resistance: false
      frozen: false
      shield-in-main-hand: false
      shield-reset:
        enabled: true
        delay-seconds: 5.0
        axe-stun-seconds: 5.0
      shield-durability:
        unbreaking-3: false
        unbreakable: false
      pvp-enabled: true
    combat:
      strafe: false
      wtap: false
      stap: false
      crits: false
      shield-breaker: false
      retreat: false
      reach-mode: NORMAL
      aggression: LOW
      crit-chance: 25
      crit-speed: SLOW
      gapple-enabled: false
      gapple-health-hearts: 4.5
      potion-mode: 0
    inventory:
      helmet-material: netherite
      chestplate-material: netherite
      leggings-material: netherite
      boots-material: netherite
      helmet-enchant: protection
      chestplate-enchant: protection
      leggings-enchant: protection
      boots-enchant: protection
      offhand-type: totem
      totem-count: 64
      armor-durability:
        breakable: true
        unbreaking-3: true
      main-hand:
        material: NETHERITE_SWORD
        amount: 1
        unbreakable: true
        enchantments:
          sharpness: 5
          knockback: 1
      trims:
        helmet:
          pattern: ward
          material: gold
        chest:
          pattern: ward
          material: gold
        legs:
          pattern: ward
          material: gold
        boots:
